name: Build data and Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Re-download landmarks and roads from OpenStreetMap"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to refresh OpenStreetMap data
        id: data
        run: |
          refresh=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh_data }}" = "true" ]; then refresh=true; fi
          if [ ! -f data/landmarks.json ] || [ ! -f data/roads.json ]; then refresh=true; fi
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "$before" 2>/dev/null; then
            if git diff --name-only "$before" HEAD | grep -q '^tools/build_landmarks.py$'; then refresh=true; fi
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          echo "refresh=$refresh"

      - name: Download landmarks and roads from OpenStreetMap
        if: steps.data.outputs.refresh == 'true'
        run: python3 tools/build_landmarks.py

      - name: Commit data files
        if: steps.data.outputs.refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/landmarks.json data/roads.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update landmarks and roads data from OpenStreetMap"
          git push origin HEAD:${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK (Capacitor wrapper around the web app)
        run: bash tools/build_apk.sh

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --short HEAD)
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest build/ma-roim.apk \
            --target "$(git rev-parse HEAD)" --prerelease \
            --title "מה רואים – APK ($sha)" \
            --notes "גרסת בדיקה של האפליקציה, נבנתה אוטומטית מהענף ${{ github.ref_name }} ($sha). להורדה בטלפון: ma-roim.apk, ואז לאשר התקנה ממקור לא ידוע."
