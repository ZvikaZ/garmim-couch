name: Build landmarks data

on:
  push:
    paths:
      - tools/build_landmarks.py
      - .github/workflows/landmarks.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: landmarks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download landmarks from OpenStreetMap
        run: python3 tools/build_landmarks.py --out data/landmarks.json
      - name: Commit data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/landmarks.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update landmarks data from OpenStreetMap"
          git push
